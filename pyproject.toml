[project]
name = "smart-storage"
version = "0.1.0"
description = "IT Peripheral Recognition System — Computer Vision pipeline for automatic classification of IT peripherals by color and size"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.9,<4.12",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4,<1.6",
    "pandas>=2.2,<2.3",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

ml-tabular = [
    "lightgbm>=4.3",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "albumentations>=1.4",
]

ml-cnn = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",
    "albumentations>=1.4",
    "ultralytics>=8.0",
]

notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
